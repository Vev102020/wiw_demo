data-store = { module = "androidx.datastore:datastore-preferences", version.ref = "data-store" }
redis = { module = "redis.clients:jedis", version.ref = "redis" }
# parser deviceInfo
ua-parser = { module = "com.github.ua-parser:uap-java", version.ref = "ua-parser" }

[bundles]
compose = [
    "androidx-ui",
    "androidx-ui-graphics",
    "androidx-material3",
    "androidx-activity-compose",
    "androidx-fragment-ktx"
]


android-ui = [
    "androidx-appcompat",
    "androidx-constraintlayout",
    "material"
]

android-base = [
    "androidx-activity-ktx",
    "androidx-core-ktx",
    "androidx-activity",
]

koin = [
    "koin-core",
    "koin-android"
]

ktor-client = [
    "ktor-client-core",
    "ktor-client-cio",
    "ktor-serialization-kotlinx-json",
    "ktor-client-android",
    "ktor-client-content-negotiation",
    "ktor-client-logging",
    "ktor-client-auth"
]

ktor-server = [
    "ktor-server-cio",
    "ktor-server-core",
    "ktor-server-netty",
    "ktor-server-websockets",
    "ktor-server-auth",
    "ktor-server-auth-jwt",
    "ktor-server-content-negotiation",
    "ktor-server-call-logging",
    "ktor-server-cors",
    "ktor-server-rateLimiting",
    "ktor-server-status-pages",
    "redis"
]


exposed = [
    "exposed-core",
    "exposed-jdbc",
    "exposed-dao",
    "exposed-java-time"
]

flyway = [
    "flyway-core",
    "flyway-postgresql"
]

lifecycle = [
    "lifecycle-livedata-ktx",
    "lifecycle-viewModel-ktx",
    "androidx-lifecycle-runtime-ktx"
]

coroutines = [
    "kotlinx-coroutines-android",
    "kotlinx-coroutines-core"
]
tests = [
    "junit",
    "androidx-junit",
    "androidx-espresso-core"
]


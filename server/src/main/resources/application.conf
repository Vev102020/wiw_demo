ktor {
    deployment {
        development = true
        port = 8080
    }
    application {
        modules = [ core.plugins.ApplicationKt.rootModule ]
    }
}

app {
    name = ${APP_NAME}
}

cors {
    allowedDomains = ${ALLOWED_DOMAINS}
}

jwt {
    secret = ${JWT_SECRET}
    issuer = ${SERVER_URL}
    audience = ${SERVER_URL}"/main"
}

crypto {
    secret = ${CRYPTO_SECRET}
}

postgres {
    url = ${DB_URL}
    user = ${DB_USER}
    password = ${DB_PASSWORD}
}

redis {
    host = ${REDIS_HOST}
    host = "localhost"
    port = 6379
}

smtp {
    host = ${SMTP_HOST}
    port = ${SMTP_PORT}
    email = ${SMTP_SENDER_EMAIL}
    password = ${SMTP_SENDER_PASSWORD}
}